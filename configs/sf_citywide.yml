paths:
  raw_dir: "data/raw/sf_citywide"
  processed_dir: "data/processed/sf_citywide"
  runs_dir: "data/runs"
  web_output_dir: "data/web_outputs"

terrain_prep:
  hydro_dem_file: "data/processed/sf_citywide/sf_citywide_hydro_dem_2m.tif"
  manning_n_file: "data/processed/sf_citywide/sf_citywide_manning_n_2m.tif"
  curve_number_file: "data/processed/sf_citywide/sf_citywide_curve_number_2m.tif"
  bridge_buffer_m: 12.0
  approach_sample_m: 10.0
  carve_half_width_m: 5.0
  min_bump_m: 0.15
  max_bump_m: 6.0
  building_handling: "elevation_bump"
  building_elevation_bump_m: 3.0
  building_manning_n: 0.30
  manning_n_paved: 0.030
  manning_n_water: 0.020
  manning_n_open_space: 0.035
  manning_n_vegetation: 0.060
  default_urban_hsg: "D"
  nodata_value: -9999.0
  shoreline_crest_half_width_m: 2.0
  shoreline_elevation_col: "Z_Mean"
  # Reproducible Phase 2A terrain QA controls (never hand-edit .tifs)
  # - Winston Dr / Stonestown Galleria (37.7270, -122.4775): covered mall deck / skybridge
  # - Embarcadero / Howard St Muni Metro portal (37.7914, -122.3909): sunken rail portal retaining wall (verified; no cut)
  # - Shoreline perimeter (~37.757, -122.509 Ocean Beach / Bayshore): 20m/30m stair-stepped water edge (tracked for export smoothing)
  # - Cayuga Ave (37.7168, -122.4458): 20m zsmax downscale artifact on sloped street (grid resolution, not DEM)
  carve_exclude_osm_ids:
    - 35156816
    - 35156817
  manual_underpass_cuts: []

sfincs_model:
  docker_image: "deltares/sfincs-cpu:latest"
  reference_time_utc: "2020-01-01T00:00:00"
  rain_source: "mrms"  # "mrms" applies NOAA MRMS 1 km QPE where mrms_qpe_file is set (AR hindcasts); design storms use Atlas 14 CSVs
  antecedent_5day_file: "data/raw/sf_citywide/sf_mrms_antecedent_5day.json"
  antecedent_amc3_threshold_mm: 28.0
  drainage_tier: "tier0"  # Kept at tier0 after v0.4 Phase 2 ablation; tier1a/1b/2 available via config or --drainage-tier
  drainage_rate_mm_hr: 5.0
  drainage_grid_res_m: 40.0
  tier1a_base_mm_hr: 2.0
  tier1a_max_mm_hr: 10.0
  tier1b_head_full_m: 1.5
  dtout_s: 3600.0
  dtmaxout_s: 86400.0
  alpha: 0.75
  huthresh_m: 0.01
  advection: 1
  subgrid_nbins: 10
  subgrid_max_gradient: 5.0
  cn_reproj_method: "med"
  outflow_perimeter_bounds: true
  coastal_bound_zmax_m: 0.5
  quadtree:
    enabled: false
    base_resolution_m: 40.0
    refinement_levels: 2  # 40m -> 20m -> 10m in low-lying urban/coastal corridors
    refine_zmax_m: 15.0
    min_polygon_area_m2: 10000.0

validation:
  depth_threshold_m: 0.1524
  min_land_elevation_m: 0.5
  downscaled_depth_file: "data/processed/sf_citywide/sf_citywide_100yr_slr0ft_depth_2m.tif"
  summary_file: "data/processed/sf_citywide/validation_summary.json"
