# San Francisco Benchmark Configuration
# Evaluates 10-yr and 100-yr rain events crossed with 0, +1, +3, and +5 ft SLR
# mapped to 2024 California Ocean Protection Council (OPC) Sea Level Rise Guidance.

project:
  name: sf_benchmark
  region_id: "sf_mission_alemany"
  baseline_scenario: "sf_100yr_slr0ft"
  crs: "EPSG:26910"  # NAD83 / UTM Zone 10N (meters)
  output_crs: "EPSG:3857"  # Web Mercator for Cloud Optimized GeoTIFFs
  vertical_datum: "NAVD88"
  tide_gauge: "9414290"  # NOAA San Francisco, CA

domain:
  # ~20.16 km^2 (4.2 km x 4.8 km) SF Mission/Alemany corridor [xmin, ymin, xmax, ymax] in EPSG:26910
  bbox_epsg26910: [550000.0, 4175800.0, 554200.0, 4180600.0]
  fetch_buffer_m: 500.0
  grid_resolution_m: 10.0  # 10m-20m SFINCS computational grid
  subgrid_resolution_m: 1.0  # 1m-2m subgrid terrain tables
  dem_source: "data/raw/sf_topobathy_dem.tif"
  nlcd_landcover_source: "data/raw/sf_nlcd_2021_landcover.tif"
  nlcd_impervious_source: "data/raw/sf_nlcd_2021_impervious.tif"
  hsg_soils_source: "data/raw/sf_usda_hsg.gpkg"
  roads_rail_source: "data/raw/sf_osm_roads_rail.gpkg"
  buildings_source: "data/raw/sf_buildings.gpkg"
  validation_reference: "data/raw/sfpuc_100yr_flood_risk.gpkg"

# NOAA Atlas 14 Vol. 6 v2 PDS precipitation frequency depths (mm) at (37.745, -122.415)
rain_events:
  rain_10yr:
    label: "10-Year Design Storm"
    return_period_yr: 10
    duration_hr: 24
    total_depth_mm: 90.4
    hyetograph_method: "alternating_block"
    timestep_min: 15
    idf_depths_mm:
      5: 6.3
      10: 9.1
      15: 11.0
      30: 15.0
      60: 21.2
      120: 29.5
      180: 36.6
      360: 50.3
      720: 67.8
      1440: 90.4
    hyetograph_file: "data/raw/sf_hyetograph_10yr_24hr.csv"
  rain_100yr:
    label: "100-Year Design Storm"
    return_period_yr: 100
    duration_hr: 24
    total_depth_mm: 144.0
    hyetograph_method: "alternating_block"
    timestep_min: 15
    idf_depths_mm:
      5: 9.6
      10: 13.8
      15: 16.7
      30: 22.9
      60: 32.3
      120: 44.5
      180: 55.1
      360: 76.2
      720: 105.9
      1440: 144.0
    hyetograph_file: "data/raw/sf_hyetograph_100yr_24hr.csv"

slr_increments:
  slr_0ft:
    slr_ft: 0.0
    slr_m: 0.0
    opc_2024_pathway: "Baseline (Present Day)"
    opc_2024_horizon: "2020"
    # Dynamic 24-48 hr tidal hydrograph (MHHW + storm surge + SLR); null for pluvial-only v0.1 baseline
    tidal_hydrograph_file: null
  slr_1ft:
    slr_ft: 1.0
    slr_m: 0.3048
    opc_2024_pathway: "2024 CA OPC Intermediate (~2050) / Intermediate-High (~2040)"
    opc_2024_horizon: "2040-2050"
    tidal_hydrograph_file: null
  slr_3ft:
    slr_ft: 3.0
    slr_m: 0.9144
    opc_2024_pathway: "2024 CA OPC Intermediate (~2100) / Intermediate-High (~2080)"
    opc_2024_horizon: "2080-2100"
    tidal_hydrograph_file: null
  slr_5ft:
    slr_ft: 5.0
    slr_m: 1.5240
    opc_2024_pathway: "2024 CA OPC Intermediate-High (~2100)"
    opc_2024_horizon: "2100"
    tidal_hydrograph_file: null

# Crossed scenario matrix: 2 rain events x 4 SLR increments = 8 runs
# v0.1 vertical slice runs sf_100yr_slr0ft first (see docs/PLAN.md)
scenarios:
  - id: sf_100yr_slr0ft
    rain: rain_100yr
    slr: slr_0ft
  - id: sf_100yr_slr1ft
    rain: rain_100yr
    slr: slr_1ft
  - id: sf_100yr_slr3ft
    rain: rain_100yr
    slr: slr_3ft
  - id: sf_100yr_slr5ft
    rain: rain_100yr
    slr: slr_5ft
  - id: sf_10yr_slr0ft
    rain: rain_10yr
    slr: slr_0ft
  - id: sf_10yr_slr1ft
    rain: rain_10yr
    slr: slr_1ft
  - id: sf_10yr_slr3ft
    rain: rain_10yr
    slr: slr_3ft
  - id: sf_10yr_slr5ft
    rain: rain_10yr
    slr: slr_5ft

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  runs_dir: "data/runs"
  web_output_dir: "data/web_outputs"

terrain_prep:
  hydro_dem_file: "data/processed/sf_hydro_dem_1m.tif"
  manning_n_file: "data/processed/sf_manning_n_1m.tif"
  curve_number_file: "data/processed/sf_curve_number_1m.tif"
  bridge_buffer_m: 12.0
  approach_sample_m: 10.0
  carve_half_width_m: 5.0
  min_bump_m: 0.15
  building_handling: "elevation_bump"  # "elevation_bump" or "high_manning"
  building_elevation_bump_m: 3.0
  building_manning_n: 0.30
  manning_n_paved: 0.030
  manning_n_water: 0.020
  manning_n_open_space: 0.035
  manning_n_vegetation: 0.060
  default_urban_hsg: "D"
  nodata_value: -9999.0

sfincs_model:
  docker_image: "deltares/sfincs-cpu:latest"
  reference_time_utc: "2020-01-01T00:00:00"
  drainage_rate_mm_hr: 5.0
  dtout_s: 3600.0
  dtmaxout_s: 86400.0
  alpha: 0.5
  huthresh_m: 0.01
  advection: 1
  subgrid_nbins: 10
  subgrid_max_gradient: 5.0
  cn_reproj_method: "med"
  outflow_perimeter_bounds: true

validation:
  depth_threshold_m: 0.1524  # 6 inches (SFPUC 100-Year Storm Flood Risk threshold)
  min_land_elevation_m: 0.5  # Exclude open Bay water below 0.5 m NAVD88 from urban flood scoring
  downscaled_depth_file: "data/processed/sf_100yr_slr0ft_depth_1m.tif"
  summary_file: "data/processed/validation_summary.json"
  sweep_drainage_rates_mm_hr: [5.0, 15.0]
  sweep_manning_n_paved: [0.020, 0.030]
